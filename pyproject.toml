[project]
name = "ratekit"
version = "0.4.0"
description = "用于演示 Fissue 的小型费率/金额计算库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ratekit maintainers" }]
keywords = ["money", "tax", "percent", "prorate", "demo"]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/"
Issues = "https://github.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
